basePath: /api/v1
definitions:
  handler.ChangePasswordRequest:
    properties:
      current_password:
        type: string
      new_password:
        minLength: 8
        type: string
    required:
    - current_password
    - new_password
    type: object
  handler.IngestCommentRequest:
    properties:
      author_handle:
        type: string
      content:
        description: |-
          Content is not required — a comment can legitimately have no text
          (sticker/image-only comment).
        type: string
      like_count:
        type: integer
      model_version:
        type: string
      platform_comment_id:
        type: string
      published_at:
        type: string
      raw_payload:
        items:
          type: integer
        type: array
      sentiment:
        allOf:
        - $ref: '#/definitions/model.Sentiment'
        enum:
        - positive
        - negative
        - neutral
      sentiment_score:
        type: number
    required:
    - platform_comment_id
    - published_at
    type: object
  handler.IngestPostRequest:
    properties:
      author_handle:
        type: string
      author_name:
        type: string
      comment_count:
        type: integer
      comments:
        items:
          $ref: '#/definitions/handler.IngestCommentRequest'
        type: array
      content:
        description: |-
          Content is not required — a post can legitimately have no caption
          (video/image-only post).
        type: string
      crawled_at:
        type: string
      like_count:
        type: integer
      model_version:
        type: string
      platform:
        allOf:
        - $ref: '#/definitions/model.Platform'
        enum:
        - x
        - instagram
        - tiktok
        - youtube
        - news
      platform_post_id:
        type: string
      published_at:
        type: string
      raw_payload:
        items:
          type: integer
        type: array
      sentiment:
        allOf:
        - $ref: '#/definitions/model.Sentiment'
        enum:
        - positive
        - negative
        - neutral
      sentiment_score:
        type: number
      share_count:
        type: integer
      url:
        type: string
      view_count:
        type: integer
    required:
    - crawled_at
    - platform
    - platform_post_id
    - published_at
    type: object
  handler.LoginRequest:
    properties:
      email:
        type: string
      password:
        type: string
    required:
    - email
    - password
    type: object
  handler.RegisterRequest:
    properties:
      email:
        type: string
      name:
        type: string
      password:
        minLength: 8
        type: string
      phone_number:
        maxLength: 20
        minLength: 8
        type: string
    required:
    - email
    - name
    - password
    - phone_number
    type: object
  handler.UpdateProfileRequest:
    properties:
      name:
        type: string
      phone_number:
        maxLength: 20
        minLength: 8
        type: string
    required:
    - name
    - phone_number
    type: object
  model.Platform:
    enum:
    - x
    - instagram
    - tiktok
    - youtube
    - news
    type: string
    x-enum-varnames:
    - PlatformX
    - PlatformInstagram
    - PlatformTikTok
    - PlatformYouTube
    - PlatformNews
  model.Sentiment:
    enum:
    - positive
    - negative
    - neutral
    type: string
    x-enum-varnames:
    - SentimentPositive
    - SentimentNegative
    - SentimentNeutral
  response.ErrorResponse:
    properties:
      error:
        type: string
      message:
        type: string
      success:
        type: boolean
    type: object
  response.Response:
    properties:
      data: {}
      message:
        type: string
      success:
        type: boolean
    type: object
host: localhost:8080
info:
  contact: {}
  description: PawonWarga Backend API Service
  title: PawonWarga API
  version: "1.0"
paths:
  /auth/login:
    post:
      consumes:
      - application/json
      description: Authenticate with email and password, returns a JWT Bearer token.
        Response messages are localized via ?lang= or Accept-Language (id/en).
      parameters:
      - description: Login credentials
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handler.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Token and user info
          schema:
            $ref: '#/definitions/response.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "401":
          description: Invalid credentials
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      summary: Login
      tags:
      - auth
  /auth/logout-all:
    post:
      description: Invalidates every JWT issued before now for this user, including
        the one used to call this endpoint — the client should discard its token and
        redirect to login. Response messages are localized via ?lang= or Accept-Language
        (id/en).
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Log out of all devices
      tags:
      - auth
  /auth/password:
    put:
      consumes:
      - application/json
      description: Changes the authenticated user's password after verifying the current
        one. Response messages are localized via ?lang= or Accept-Language (id/en).
      parameters:
      - description: Current and new password
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handler.ChangePasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "401":
          description: Current password is incorrect
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Change password
      tags:
      - auth
  /auth/profile:
    get:
      description: Returns the authenticated user's profile. Response messages are
        localized via ?lang= or Accept-Language (id/en).
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get profile
      tags:
      - auth
    put:
      consumes:
      - application/json
      description: Updates the authenticated user's profile name and phone number.
        Response messages are localized via ?lang= or Accept-Language (id/en).
      parameters:
      - description: Profile update payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handler.UpdateProfileRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Update profile
      tags:
      - auth
  /auth/profile/picture:
    post:
      consumes:
      - multipart/form-data
      description: Uploads a profile picture (jpg, png, or webp — max 5 MB). Replaces
        any existing picture. Response messages are localized via ?lang= or Accept-Language
        (id/en).
      parameters:
      - description: Profile picture file
        in: formData
        name: file
        required: true
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "503":
          description: Storage not configured
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Upload profile picture
      tags:
      - auth
  /auth/register:
    post:
      consumes:
      - application/json
      description: Create a new user account with name, email, and password. Response
        messages are localized via ?lang= or Accept-Language (id/en).
      parameters:
      - description: Registration payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handler.RegisterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: User created
          schema:
            $ref: '#/definitions/response.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "409":
          description: Email already registered
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      summary: Register a new user
      tags:
      - auth
  /dashboard/overview:
    get:
      description: 'Aggregated stats backing the main dashboard: headline, summary
        metrics, sentiment trend, per-platform volume, top keywords, topic distribution,
        and top sentiment drivers all combine posts AND comments (see repository.PostRepository''s
        Combined* methods) — unlike /mentions, which is post-only. recent_mentions
        is the one exception and stays post-only (a bare comment has no url/location/category
        of its own). topic_distribution/keyword_cloud/drivers are keyword-matched,
        not a stored classification — see service.ClassifyTopics/computeDrivers. trend.positive/neutral/negative
        are each bucket''s percentage share (0-100) and trend.*_count are that same
        bucket''s raw mention counts — the frontend''s Percentage/Total toggle switches
        between them (same shape as /sentiment/overview''s trend). The platform filter
        applies to everything except data_sources, which always reports every platform''s
        status regardless of the filter (it''s a connectivity widget, not a filtered
        breakdown). summary.*.change is always "-" — period-over-period comparison
        isn''t implemented. Response messages are localized via ?lang= or Accept-Language
        (id/en).'
      parameters:
      - description: Start date (YYYY-MM-DD, WIB) — omit for no lower bound
        in: query
        name: from
        type: string
      - description: End date (YYYY-MM-DD, WIB, inclusive) — omit for no upper bound
        in: query
        name: to
        type: string
      - description: X, Instagram, TikTok, News, or YouTube — omit for all platforms
        in: query
        name: platform
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Dashboard overview
      tags:
      - dashboard
  /health:
    get:
      description: Returns the service health status
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Health check
      tags:
      - system
  /ingest/posts:
    post:
      consumes:
      - application/json
      description: Internal endpoint for the Python sentiment-labeling worker. Upserts
        by (platform, platform_post_id, published_at); re-ingesting an existing post
        refreshes engagement counters but never overwrites an already-set sentiment.
        Response messages are localized via ?lang= or Accept-Language (id/en).
      parameters:
      - description: Post + comments payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handler.IngestPostRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/response.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - ApiKeyAuth: []
      summary: Ingest a crawled (optionally labeled) post with its comments
      tags:
      - ingest
  /keywords:
    get:
      description: Top keywords extracted from posts+comments (see service.ExtractKeywordStats),
        with q/sentiment filtering the already-extracted list rather than re-running
        extraction. growth is always "-" and alerts is always empty — both need a
        period-over-period comparison the ingested data (currently ~4 days) can't
        yet support meaningfully. stats.* reflect the whole tracked set, not just
        the filtered items. Response messages are localized via ?lang= or Accept-Language
        (id/en).
      parameters:
      - description: Free-text filter on keyword text
        in: query
        name: q
        type: string
      - description: positive, negative, neutral, or \
        in: query
        name: sentiment
        type: string
      - description: Start date (YYYY-MM-DD, WIB) — omit for no lower bound
        in: query
        name: from
        type: string
      - description: End date (YYYY-MM-DD, WIB, inclusive) — omit for no upper bound
        in: query
        name: to
        type: string
      - description: X, Instagram, TikTok, News, or YouTube — omit for all platforms
        in: query
        name: platform
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List tracked keywords
      tags:
      - keywords
  /mentions:
    get:
      description: Lists sentiment-labeled posts for the monitoring dashboard, with
        metrics and per-platform volume aggregated over the whole filtered set. Response
        messages are localized via ?lang= or Accept-Language (id/en).
      parameters:
      - description: Free-text search in content/author
        in: query
        name: q
        type: string
      - description: X, Instagram, TikTok, News, YouTube, or \
        in: query
        name: platform
        type: string
      - description: positive, negative, neutral, or \
        in: query
        name: sentiment
        type: string
      - description: Start date (YYYY-MM-DD, WIB) — omit for no lower bound
        in: query
        name: from
        type: string
      - description: End date (YYYY-MM-DD, WIB, inclusive) — omit for no upper bound
        in: query
        name: to
        type: string
      - default: 1
        description: Page number
        in: query
        name: page
        type: integer
      - default: 20
        description: Items per page
        in: query
        name: per_page
        type: integer
      - description: newest (default), oldest, or engagement
        in: query
        name: sort
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List mentions
      tags:
      - mentions
  /mentions/{id}:
    get:
      description: Returns a single sentiment-labeled mention. 404s if the post exists
        but hasn't been labeled yet. Response messages are localized via ?lang= or
        Accept-Language (id/en).
      parameters:
      - description: Post ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get mention detail
      tags:
      - mentions
  /mentions/{id}/comments:
    get:
      description: Paginated labeled comments on a single post, oldest first. 404s
        if the post doesn't exist or hasn't been labeled yet — same check GetByID
        applies. Response messages are localized via ?lang= or Accept-Language (id/en).
      parameters:
      - description: Post ID
        in: path
        name: id
        required: true
        type: integer
      - default: 1
        description: Page number
        in: query
        name: page
        type: integer
      - default: 20
        description: Items per page
        in: query
        name: per_page
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List comments for a mention
      tags:
      - mentions
  /sentiment/overview:
    get:
      description: 'Aggregated sentiment stats backing the Sentiment Analysis page:
        score, summary metrics, distribution, trend, per-platform and per-category
        breakdowns. Combines posts AND comments (see repository.PostRepository''s
        Combined* methods), like /dashboard/overview — unlike /mentions, which is
        post-only. by_category is keyword-matched (service.ClassifyTopicSentiment),
        not a stored classification. The platform filter applies to everything except
        by_platform, which always reports every platform (filtering a per-platform
        breakdown down to one platform would defeat its purpose). summary.*.change
        is always "-" — period-over-period comparison isn''t implemented. Response
        messages are localized via ?lang= or Accept-Language (id/en).'
      parameters:
      - description: Start date (YYYY-MM-DD, WIB) — omit for no lower bound
        in: query
        name: from
        type: string
      - description: End date (YYYY-MM-DD, WIB, inclusive) — omit for no upper bound
        in: query
        name: to
        type: string
      - description: X, Instagram, TikTok, News, or YouTube — omit for all platforms
        in: query
        name: platform
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Sentiment overview
      tags:
      - sentiment
securityDefinitions:
  ApiKeyAuth:
    description: Shared secret for the internal ingest routes (Python labeling worker)
    in: header
    name: X-API-Key
    type: apiKey
  BasicAuth:
    type: basic
  BearerAuth:
    description: 'Enter: Bearer {token}'
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
